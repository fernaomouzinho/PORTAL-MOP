{% extends "web_admin/layout.html" %}
{% block content %}
<ol class="breadcrumb mb-2 mt-1">
    <li class="breadcrumb-item"><a href="{% url 'admin-doc-det' doc.hashed %}">DETALHA DOKUMENTU</a></li>
    <li class="breadcrumb-item active" aria-current="page">{{ legend|upper }}</li>
</ol>
<div class="row">
	<div class="col-sm-12">
		{% if doc.file %}
		<embed src="{{ doc.file.url }}" type="application/pdf" height="700px" width="100%">
		</div>
		{% else %}
		<p>Pajina la iha!</p>
		{% endif %}
	</div>
	<hr/>
	{% endblock %}

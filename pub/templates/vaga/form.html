{% extends "web_admin/layout.html" %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container-fluid py-3">

    <!-- Breadcrumb -->
    <ol class="breadcrumb bg-white shadow-sm rounded px-3 py-2 mb-3">
        <li class="breadcrumb-item">
            <a href="{% url 'admin-vaga-list' %}" class="text-decoration-none">
                LISTA VAGA
            </a>
        </li>
        <li class="breadcrumb-item active" aria-current="page">
            {{ legend|upper }}
        </li>
    </ol>

    <!-- Form Card -->
    <div class="card border-0 shadow-sm rounded-4">

        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0 text-uppercase">{{ legend }}</h5>
        </div>

        <div class="card-body p-3 p-md-4">

            <div class="row">
                <div class="col-12 col-lg-12col-xl-12 mx-auto">

                    {% crispy form %}

                </div>
            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block scripts %}
{% endblock %}

{% extends "web_admin/layout.html" %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container-fluid py-3">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb bg-light px-3 py-2 rounded-3 shadow-sm">
            <li class="breadcrumb-item">
                <a href="{% url 'admin-news-list' %}" class="text-decoration-none">
                    NUTISIA
                </a>
            </li>
            <li class="breadcrumb-item active text-uppercase" aria-current="page">
                {{ legend }}
            </li>
        </ol>
    </nav>

    <!-- Form Card -->
    <div class="row justify-content-center">

        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">

            <div class="card border-0 shadow-sm rounded-4">

                <!-- Header -->
                <div class="card-header bg-white text-white">
                    <h5 class="mb-0 text-uppercase">{{ legend }}</h5>
                </div>

                <!-- Body -->
                <div class="card-body p-4">

                    {% crispy form %}

                    <!-- Optional Preview Image -->
                    <div class="mt-4 text-center">
                        <img id="output"
                             class="img-fluid rounded-4 shadow-sm d-none"
                             style="max-height:320px; object-fit:cover;">
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block scripts %}

<script>
$(document).ready(function () {

    $("input[type='file']").on("change", function (event) {

        const file = event.target.files[0];

        if (file) {
            const output = document.getElementById("output");

            output.src = URL.createObjectURL(file);
            output.classList.remove("d-none");
        }

    });

});
</script>

{% endblock %}

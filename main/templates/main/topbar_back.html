{% load static %}
<section id="topbar" class="d-flex align-items-center">
    <div class="container d-flex justify-content-center justify-content-md-between">
      <div class="contact-info d-flex align-items-center">
        <i class="bi bi-envelope-fill"></i><a href="mailto:{{contact.email}}">{{contact.email}}</a>
        <i class="bi bi-phone-fill phone-icon"></i> {{contact.phone}}
      </div>
      <div class="social-links d-none d-md-block">
        <a href="{% url 'home' l1 %}" class="tetum" title="Tetum"><img data-src="{% static 'main/img/TL-16.png' %}"></a>
        <a href="{% url 'home' l2 %}" class="portugues" title="Portugues"><img data-src="{% static 'main/img/POR-16.png' %}"></a>
        <a href="{% url 'home' l3 %}" class="english" title="English"><img data-src="{% static 'main/img/ENG-16.png' %}"></a>
      </div>
    </div>
  </section>

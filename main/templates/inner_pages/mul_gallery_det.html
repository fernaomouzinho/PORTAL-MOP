{% extends "main/inner_page.html" %}
{% load static %}
{% block content %}
	<!-- ======= Breadcrumbs ======= -->
	<section class="breadcrumbs">
	  <div class="container">

		<div class="d-flex justify-content-between align-items-center">
		  <h2></h2>
		  <ol>
			<li><a href="{% url 'gallery' lang gallery.album.hashed %}">{{ legend2 }} </a></li>
			<!-- <li>{{ legend }}</li> -->
		  </ol>
		</div>

	  </div>
	</section><!-- End Breadcrumbs -->

	<section class="inner-page">
	  	<div class="container">
	  		<div class="section-title">
          		<h2>{{ legend }}</h2>
				<div id="fb-root"></div>
				<div class="fb-share-button" data-href="https://mop.gov.tl{{ request.get_full_path }}" data-layout="button_count"></div>
        	</div>

        	<div class="row gy-4">
                <div class="col-lg-12">
                <center>
                    <img src="{% static 'main/images/blank.jpg' %}" data-src="{{ gallery.image.url }}" class="img-fluid" alt="">
                </center>
                </div>
      		</div>
	  	</div>
	</section>

{% endblock %}
{% block scripts %}

  <link href="{% static 'main/assets/vendor/glightbox/css/glightbox.min.css' %}" rel="stylesheet">
  <link href="{% static 'main/assets/vendor/swiper/swiper-bundle.min.css' %}" rel="stylesheet">

  <script src="{% static 'main/assets/vendor/glightbox/js/glightbox.min.js' %}"></script>
  <script src="{% static 'main/assets/vendor/swiper/swiper-bundle.min.js' %}"></script>

  <!-- Template Main JS File -->
  <script src="{% static 'main/assets/js/main.js' %}"></script>
{% endblock %}

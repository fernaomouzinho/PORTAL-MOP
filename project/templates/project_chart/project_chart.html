{% extends "web_admin/layout.html" %}
{% load static %}
{% block content %}
	<div class="row">
		<div class="col-sm-12">
			<div class="card shadow-lg pt-3 rounded">
				<div class="card-header">{{ legend|upper }}</div>
				<div class="card-body">
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="card shadow-lg pt-3 rounded">
                                <div class="card-body">
                                    <canvas id="pieChart_v"></canvas>
                                </div> <!--end card-body-->
                            </div> <!--end card-->
                        </div> <!--end col-->
                        <div class="col-sm-6">
                            <div class="card shadow-lg pt-3 rounded">
                                <div class="card-body">
                                    <canvas id="pieChart_i"></canvas>
                                </div> <!--end card-body-->
                            </div> <!--end card-->
                        </div> <!--end col-->
                    </div> <!--end row-->
                    <hr/>
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="card shadow-lg pt-3 rounded">
                                <div class="card-body">
                                    <div id="container" style="width: 50%;">
                                    
                                    </div>
                                </div> <!--end card-body-->
                            </div> <!--end card-->
                        </div> <!--end col-->
                    </div> <!--end row-->
				</div> <!--end card-body-->
			</div> <!--end card-->
		</div> <!--end col-->
	</div> <!--end row-->
{% endblock %}
{% block scripts %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.3/dist/Chart.min.js"></script>
    <script>
        const data_v = {
            labels: {{ label_v|safe }},
            datasets: [{
              data: {{ grand_sum_v|safe }},
                backgroundColor: [
                    '#1f78b4','#a6cee3','#33a02c','#ff7f00','#a6d854','#e31a1c'
                ],
                borderWidth: 1
            }]
        };

        const config_v = {
            type: 'pie',
            data: data_v,
            options: {
                responsive: true,
                legend: {
                    display: true,
                    position: 'left',
                    labels: {
                        fontColor: 'rgb(255, 99, 132)',
                        font: {
                        size: 10
                    }
                    }
                }
            }
        };

        const pieChart_v = new Chart(
            document.getElementById('pieChart_v'),
            config_v
        );
        

        const data_i = {
            labels: {{ label_i|safe }},
            datasets: [{
              data: {{ grand_sum_i|safe }},
                backgroundColor: [
                    '#1f78b4','#a6cee3','#33a02c','#ff7f00','#a6d854','#e31a1c'
                ],
                borderWidth: 1
            }]
        };

        const config_i = {
            type: 'pie',
            data: data_i,
            options: {
                responsive: true,
                legend: {
                    display: true,
                    position: 'right',
                    labels: {
                        fontColor: 'rgb(255, 99, 132)'
                    }
                }
            }
        };

        const pieChart_i = new Chart(
            document.getElementById('pieChart_i'),
            config_i
        );
      </script>
{% endblock %}

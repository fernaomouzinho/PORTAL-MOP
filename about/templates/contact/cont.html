{% extends "web_admin/layout.html" %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container-fluid py-3">

    <!-- Header -->
    <div class="card border-0 shadow-sm rounded-4 mb-3">
        <div class="card-header bg-white text-white">
            <h5 class="mb-0 text-uppercase">{{ legend }}</h5>
        </div>
    </div>

    <!-- Contact Info + Form -->
    <div class="card border-0 shadow-sm rounded-4 mb-3">

        <div class="card-body p-4">

            <!-- Contact Table -->
            <div class="table-responsive mb-4">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Email</th>
                            <th>Telemovel</th>
                            <th>Enderesu</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>{{ objects.email }}</td>
                            <td>{{ objects.phone }}</td>
                            <td>{{ objects.address }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <hr>

            <!-- Form -->
            <div class="mt-3">
                {% crispy form %}
            </div>

        </div>
    </div>

</div>

<div class="row"> 
<div class="col-sm-12 pl-4 pr-4"> 
<div class="card border-0 shadow-sm rounded-4">
<div class="card-body p-0">
<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1355.199902304119!2d125.57334897196584!3d-8.557326564283148!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2d01e7dc205368d9%3A0x453cd77e9dd5aae4!2sMinist%C3%A9rio%20das%20Obras%20P%C3%BAblicas!5e0!3m2!1sen!2stl!4v1686868670748!5m2!1sen!2stl" width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe> 
</div> 
</div><!--end row--> 
</div> <!--end card-body--> 
</div> <!--end card--> 
</div> 
</div> <!--end card--> 
</div> 
<!--end col--> </div> <!--end row-->

{% endblock %}

{% block scripts %}
{% endblock %}

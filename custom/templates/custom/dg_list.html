{% extends "web_admin/layout.html" %}

{% block content %}

<div class="container-fluid py-3">

    <!-- Header -->
    <div class="card border-0 shadow-sm rounded-4 mb-3">

        <div class="card-header bg-white text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0 text-uppercase">{{ legend }}</h5>

            <a class="btn btn-light btn-sm"
               href="{% url 'admin-dg-add' %}">
                <i class="fa fa-plus me-1"></i> Aumenta
            </a>

        </div>

    </div>

    <!-- Table Card -->
    <div class="card border-0 shadow-sm rounded-4">

        <div class="card-body p-4">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0" id="example">

                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Naran</th>
                            <th class="text-center">Aksi</th>
                        </tr>
                    </thead>

                    <tbody>

                        {% for obj in objects %}
                        <tr>

                            <td>{{ forloop.counter }}</td>

                            <td>
                                <a href="{% url 'admin-dg-det' obj.id %}"
                                   class="text-decoration-none fw-semibold">
                                    {{ obj.name_tt }}
                                </a>
                            </td>

                            <td class="text-center">
                                <a class="btn btn-sm btn-outline-primary"
                                   href="{% url 'admin-dg-edit' obj.id %}"
                                   title="Altera">
                                    <i class="fa fa-edit"></i>
                                </a>
                            </td>

                        </tr>
                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block scripts %}
<script>
$(document).ready(function () {

    $('#example').DataTable({
        responsive: true,
        pageLength: 5,
        lengthMenu: [5, 10, 25, 50]
    });

});
</script>
{% endblock %}
